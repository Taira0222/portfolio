# .github/workflows/deploy.yml
name: Deploy
on:
  push:
    branches: [main]

permissions:
  contents: write # ← gh-pages ブランチへ push するために必要

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 外部の部品は commit の ID で固定する（タグは差し替えられるため）。上げるときは出てから 3 日たった版に
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # token を git の設定に残さない（npm ci で入る部品から読めないように）

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # 書き込みの権限がある処理なのでキャッシュを使わない

      - run: npm ci
      - run: npm run build

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false # .nojekyll を置く
          # cname: www.example.com # 独自ドメインの場合のみ
