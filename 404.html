<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // FOUC防止: CSS読込前にテーマを確定させる（useTheme と同じ解決順序）
      // デフォルトはライト。dark を明示的に保存している場合のみダークで開始する
      (function () {
        try {
          var dark = localStorage.getItem('theme') === 'dark';
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage が使えない環境ではライトのまま表示 */
        }
      })();
      // <html lang> を URL の言語に合わせる（英語は /、日本語は /ja。src/lib/language.ts と同じ決め方）。
      // 宣言と中身の言語がズレると、ブラウザの翻訳機能が誤判定するため。
      (function () {
        var path = location.pathname.slice('/portfolio/'.replace(/\/+$/, '').length);
        document.documentElement.lang = /^\/ja(\/|$)/.test(path) ? 'ja' : 'en';
      })();
    </script>
    <!-- 英語のページの題名と説明。日本語のページ（/ja/）の分は scripts/postbuild.mjs が書き換える -->
